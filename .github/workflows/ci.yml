name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Self-scan (dogfood)
        run: |
          agentmortem scan examples/transcripts/malicious_session.jsonl --format json --fail-on off > /dev/null
          agentmortem scan examples/configs/bad-agent --format json --fail-on off > /dev/null
          agentmortem scan examples/configs/good-agent --fail-on off
      - name: Verify package builds
        run: |
          pip install build
          python -m build
          ls dist/

  action:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from source
        run: pip install .
      - name: Smoke-test the installed entrypoint
        run: |
          agentmortem --version
          agentmortem scan examples/transcripts/benign_session.jsonl
