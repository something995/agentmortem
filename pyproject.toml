[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmortem"
version = "0.1.0"
description = "Post-mortem forensics for AI agent sessions: prompt injection, secret leakage, and risky capability sequences. Deterministic, offline, CI-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentMortem contributors" }]
keywords = [
    "ai-agents",
    "security",
    "prompt-injection",
    "secret-scanning",
    "mcp",
    "post-mortem",
    "forensics",
    "sarif",
    "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "build>=1.2",
]

[project.scripts]
agentmortem = "agentmortem.cli:main"

[project.urls]
Homepage = "https://github.com/something995/New-idea"
Issues = "https://github.com/something995/New-idea/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
